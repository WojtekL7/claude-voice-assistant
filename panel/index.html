<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Coding Assistant — Panel administracyjny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Motyw przeniesiony 1:1 z makiety cloud.co.design (Voltra Admin) */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family:'Onest',system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  [data-theme="light"] {
    --bg:#f6f6f5; --sidebar:#fbfbfa; --card:#ffffff; --border:#e9e8e4; --border2:#e3e2dd;
    --divider:#f0efec; --row:#f6f5f2; --subtle:#faf9f7; --input:#faf9f7;
    --text:#1b1a18; --text-strong:#3a3835; --text-med:#5a574f; --text2:#76746f; --muted:#a3a09a;
    --scroll:#dcdbd6; --avatar:#e8e6e1; --avatar-text:#5a574f; --topbar:rgba(246,246,245,0.86);
    --feature-bg:linear-gradient(160deg,#1b1a18,#34322d); --feature-text:#ffffff; --feature-sub:#bdbab2; --feature-track:rgba(255,255,255,0.15);
    --ok-bg:#e3f5ec; --ok-fg:#0d9f6e; --warn-bg:#fdf2e3; --warn-fg:#d97706; --err-bg:#fbeaea; --err-fg:#dc2626;
    --invert-bg:#1b1a18; --invert-text:#ffffff;
    --accent:#7c3aed; --accent-h:#6d28d9; --accent-d:#a78bfa; --accent-rgba:rgba(124,58,237,0.18); --accent-tint:#f0e9fe;
  }
  [data-theme="dark"] {
    --bg:#1b1f2c; --sidebar:#1f2433; --card:#262b3b; --border:#363d52; --border2:#3f4659;
    --divider:#2f3547; --row:#2a3041; --subtle:#222736; --input:#1f2433;
    --text:#eef1f8; --text-strong:#dde1ed; --text-med:#c4c9d8; --text2:#9aa0b3; --muted:#777e92;
    --scroll:#3f4659; --avatar:#363d52; --avatar-text:#c4c9d8; --topbar:rgba(27,31,44,0.86);
    --feature-bg:linear-gradient(160deg,#2a3045,#333a52); --feature-text:#eef1f8; --feature-sub:#9aa0b3; --feature-track:rgba(255,255,255,0.13);
    --ok-bg:rgba(13,159,110,0.18); --ok-fg:#3ddba0; --warn-bg:rgba(217,119,6,0.20); --warn-fg:#f7af3a; --err-bg:rgba(220,38,38,0.20); --err-fg:#f98080;
    --invert-bg:#eef1f8; --invert-text:#1b1f2c;
    --accent:#7c3aed; --accent-h:#6d28d9; --accent-d:#a78bfa; --accent-rgba:rgba(124,58,237,0.30); --accent-tint:rgba(124,58,237,0.22);
  }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; border: 3px solid var(--bg); }
  input, button, textarea, select { font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: none; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  a { color: var(--accent); }
  .navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:none;font-size:14px;font-weight:500;cursor:pointer;text-align:left;background:transparent;color:var(--text2);}
  .navbtn.on{background:var(--accent-tint);color:var(--accent);}
  .navbtn svg{flex:none}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .kpi .lbl{font-size:13px;color:var(--text2);font-weight:500;}
  .kpi .val{font-family:'JetBrains Mono';font-size:27px;font-weight:600;margin-top:13px;letter-spacing:-1px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;}
  .btnP{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btnP:hover{background:var(--accent-h);}
  .btnG{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;border:1px solid var(--border2);background:var(--card);color:var(--text-strong);font-size:13.5px;font-weight:600;cursor:pointer;}
  .demo{display:inline-flex;align-items:center;gap:5px;background:var(--warn-bg);color:var(--warn-fg);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;font-family:'JetBrains Mono';}
  .h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-0.5px;}
  .sub{margin:6px 0 0;font-size:14px;color:var(--text2);}
  .badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .b-ok{background:var(--ok-bg);color:var(--ok-fg);} .b-warn{background:var(--warn-bg);color:var(--warn-fg);}
  .b-err{background:var(--err-bg);color:var(--err-fg);} .b-neu{background:var(--divider);color:var(--text2);}
  .pillPro{background:var(--accent-tint);color:var(--accent);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;}
  .pillFree{background:var(--divider);color:var(--text-med);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;}
  .mono{font-family:'JetBrains Mono';}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--invert-bg);color:var(--invert-text);padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:99;opacity:0;transform:translateY(8px);transition:.2s;}
  .toast.show{opacity:1;transform:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:440px;}
  .fld{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin:14px 0 6px;}
  .inp{width:100%;padding:10px 13px;border-radius:9px;border:1px solid var(--border2);background:var(--input);color:var(--text);font-size:13.5px;}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px;}
</style>
</head>
<body data-theme="light">
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal"></div>

<script>
// ============================================================================
// Vibe Coding Assistant — Panel administracyjny
// Przetłumaczone z makiety cloud.co.design (Voltra Admin). Realne dane wpięte
// pod backend server/ (FastAPI). Sekcje bez backendu oznaczone znaczkiem DEMO.
// ============================================================================

const LS = {
  get api(){return localStorage.getItem('vca_api')||'http://localhost:8088';},
  set api(v){localStorage.setItem('vca_api',v);},
  get token(){return localStorage.getItem('vca_token')||'';},
  set token(v){localStorage.setItem('vca_token',v);},
  get theme(){return localStorage.getItem('vca_theme')||'light';},
  set theme(v){localStorage.setItem('vca_theme',v);},
  get lang(){return localStorage.getItem('vca_lang')||'pl';},
  set lang(v){localStorage.setItem('vca_lang',v);},
};

const state = {
  tab: 'dashboard', theme: LS.theme, lang: LS.lang,
  api: LS.api, token: LS.token, connected: false,
  data: { licenses: [], versions: [], stats: null },
  loading: false, error: '',
};

// ---------- i18n (z makiety + klucze panelu) ----------
const T = {
  pl: {
    nav:{dashboard:'Dashboard',downloads:'Pobrania',clients:'Klienci',finance:'Finanse',subs:'Subskrypcje',messages:'Wiadomości',settings:'Ustawienia'},
    appName:'Vibe Coding Assistant', console:'Panel admina', roleAdmin:'Administrator',
    dashSub:'Przegląd licencji i pobrań z serwera.', dlSub:'Wersje i pobrania.',
    clientsSub:'Licencje i subskrypcje klientów.', subsSub:'Plany i aktywne subskrypcje (z licencji).',
    financeSub:'Przychody, koszty, faktury.', msgSub:'Zgłoszenia od klientów.', settingsSub:'Połączenie z serwerem i konfiguracja.',
    demo:'Demo / makieta', demoNote:'Te dane są makietą — podłączymy je w Fazie B (płatności/wiadomości).',
    kpiSubs:'Aktywne subskrypcje (Pro)', kpiDownloads:'Pobrania (30 dni)', kpiLicenses:'Wszystkie licencje', kpiTrials:'Trial / próbni',
    kpiMrr:'MRR — przychód miesięczny', kpiConv:'Konwersja free → pro',
    dlByOs:'Pobrania wg systemu', dlByOsSub:'Udział platform · 30 dni', totalDownloads:'Łącznie pobrań',
    recentPayments:'Ostatnie płatności', viewAll:'Zobacz wszystkie →',
    thClient:'Klient / e-mail', thPlan:'Plan', thStatus:'Status', thDevices:'Urządzenia', thKey:'Klucz', thExpires:'Wygasa', thJoined:'Utworzono',
    thVersion:'Wersja', thPlatform:'Platforma', thSize:'Rozmiar', thDownloads:'Pobrania', thDate:'Data', thAmount:'Kwota', thRenews:'Odnawia',
    addClient:'+ Dodaj licencję', uploadBuild:'+ Dodaj wersję', refresh:'Odśwież', revoke:'Odbierz', confirmRevoke:'Odebrać tę licencję?',
    filterAll:'Wszystkie', filterPro:'Pro', filterFree:'Free', filterTrial:'Trial',
    releaseHistory:'Historia wydań', buildFree:'Build Free', buildPro:'Build Pro', current:'aktualna',
    pro:'Pro', free:'Free', trial:'Trial',
    s:{trial:'Trial',active:'Aktywna',expired:'Wygasła',revoked:'Odebrana',paid:'Opłacona',pending:'Oczekuje',failed:'Nieudana',stable:'stabilny',beta:'beta'},
    activeSubs:'Aktywne subskrypcje', planFreeUsers:'aktywnych', priceMonth:'59 zł / mc', priceYear:'499 zł / rok',
    connTitle:'Połącz z serwerem', connSub:'Podaj adres API i token administratora.', apiUrl:'Adres API (np. http://localhost:8088)', adminToken:'Token administratora', connect:'Połącz', logout:'Wyloguj',
    connError:'Nie udało się połączyć — sprawdź adres API i token.', noData:'Brak danych.',
    newLicense:'Nowa licencja', email:'E-mail klienta', plan:'Plan', durationDays:'Ważność (dni, 0 = bezterminowo)', maxDevices:'Limit urządzeń', create:'Utwórz', cancel:'Anuluj',
    newVersion:'Nowa wersja', vVersion:'Wersja (np. 1.0.21)', vPlatform:'Platforma', vUrl:'URL paczki', vSha:'SHA256', vSize:'Rozmiar (bajty)', add:'Dodaj',
    productProfile:'Profil produktu', productName:'Nazwa produktu', supportEmail:'Adres pomocy', paymentIntegration:'Integracja płatności (Faza B)', notifications:'Powiadomienia (Faza B)', connection:'Połączenie z serwerem',
    months:['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'], never:'—',
  },
  en: {
    nav:{dashboard:'Dashboard',downloads:'Downloads',clients:'Clients',finance:'Finance',subs:'Subscriptions',messages:'Messages',settings:'Settings'},
    appName:'Vibe Coding Assistant', console:'Admin console', roleAdmin:'Administrator',
    dashSub:'Overview of licenses and downloads from the server.', dlSub:'Versions and downloads.',
    clientsSub:'Customer licenses and subscriptions.', subsSub:'Plans and active subscriptions (from licenses).',
    financeSub:'Revenue, costs, invoices.', msgSub:'Customer tickets.', settingsSub:'Server connection and configuration.',
    demo:'Demo / mockup', demoNote:'This data is a mockup — it will be wired in Phase B (payments/messages).',
    kpiSubs:'Active subscriptions (Pro)', kpiDownloads:'Downloads (30 days)', kpiLicenses:'All licenses', kpiTrials:'Trials',
    kpiMrr:'MRR — monthly revenue', kpiConv:'Free → pro conversion',
    dlByOs:'Downloads by platform', dlByOsSub:'Platform share · 30 days', totalDownloads:'Total downloads',
    recentPayments:'Recent payments', viewAll:'View all →',
    thClient:'Client / email', thPlan:'Plan', thStatus:'Status', thDevices:'Devices', thKey:'Key', thExpires:'Expires', thJoined:'Created',
    thVersion:'Version', thPlatform:'Platform', thSize:'Size', thDownloads:'Downloads', thDate:'Date', thAmount:'Amount', thRenews:'Renews',
    addClient:'+ Add license', uploadBuild:'+ Add version', refresh:'Refresh', revoke:'Revoke', confirmRevoke:'Revoke this license?',
    filterAll:'All', filterPro:'Pro', filterFree:'Free', filterTrial:'Trial',
    releaseHistory:'Release history', buildFree:'Free build', buildPro:'Pro build', current:'current',
    pro:'Pro', free:'Free', trial:'Trial',
    s:{trial:'Trial',active:'Active',expired:'Expired',revoked:'Revoked',paid:'Paid',pending:'Pending',failed:'Failed',stable:'stable',beta:'beta'},
    activeSubs:'Active subscriptions', planFreeUsers:'active', priceMonth:'59 zł / mo', priceYear:'499 zł / yr',
    connTitle:'Connect to the server', connSub:'Enter the API address and admin token.', apiUrl:'API address (e.g. http://localhost:8088)', adminToken:'Admin token', connect:'Connect', logout:'Log out',
    connError:'Connection failed — check the API address and token.', noData:'No data.',
    newLicense:'New license', email:'Client email', plan:'Plan', durationDays:'Validity (days, 0 = lifetime)', maxDevices:'Device limit', create:'Create', cancel:'Cancel',
    newVersion:'New version', vVersion:'Version (e.g. 1.0.21)', vPlatform:'Platform', vUrl:'Package URL', vSha:'SHA256', vSize:'Size (bytes)', add:'Add',
    productProfile:'Product profile', productName:'Product name', supportEmail:'Support email', paymentIntegration:'Payment integration (Phase B)', notifications:'Notifications (Phase B)', connection:'Server connection',
    months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], never:'—',
  }
};
const t = () => T[state.lang];

// ---------- API ----------
function apiBase(){ return state.api.replace(/\/+$/,''); }
async function api(path, opts={}){
  const r = await fetch(apiBase()+path, {
    ...opts,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token, ...(opts.headers||{})},
  });
  if(!r.ok){ const txt = await r.text().catch(()=> ''); throw new Error(txt||('HTTP '+r.status)); }
  return r.status===204 ? null : r.json();
}

async function loadAll(){
  state.loading = true; render();
  try{
    const [licenses, versions, stats] = await Promise.all([
      api('/api/admin/licenses?limit=500'),
      api('/api/admin/versions'),
      api('/api/admin/downloads/stats?days=30'),
    ]);
    state.data = { licenses: licenses||[], versions: versions||[], stats: stats||null };
    state.connected = true; state.error='';
  }catch(e){ state.error = String(e.message||e); state.connected=false; }
  state.loading = false; render();
}

// ---------- helpers ----------
const esc = (s)=> String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (iso)=>{ if(!iso) return t().never; const d=new Date(iso); if(isNaN(d)) return t().never; return d.getDate()+' '+t().months[d.getMonth()]+' '+d.getFullYear(); };
const fmtNum = (n)=> (n==null?'0':Number(n).toLocaleString(state.lang==='pl'?'pl-PL':'en-US'));
const fmtSize = (b)=> b==null?'—':(b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB');
const initials = (email)=> (email||'?').slice(0,2).toUpperCase();
const statusBadge = (st)=>{ const cls={active:'b-ok',trial:'b-warn',expired:'b-err',revoked:'b-neu'}[st]||'b-neu'; return `<span class="badge ${cls}">${esc(t().s[st]||st)}</span>`; };
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }

// platforma -> czytelny system
const OS_LABEL = { 'windows-x64':'Windows', 'macos-arm64':'macOS', 'macos-x64':'macOS', 'linux-x64':'Linux' };
const osName = (p)=> OS_LABEL[p] || (p||'—');

// ============================ RENDER ============================
function render(){
  document.body.setAttribute('data-theme', state.theme);
  const app = document.getElementById('app');
  if(!state.connected){ app.innerHTML = viewLogin(); bind(); return; }
  app.innerHTML = `<div style="display:flex;min-height:100vh;">${sidebar()}${main()}</div>`;
  bind();
}

function viewLogin(){
  const x=t();
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="card" style="width:100%;max-width:430px;padding:30px;">
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:6px;">
        <div style="width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;"><span style="color:#fff;font-weight:800;font-size:16px;">V</span></div>
        <div style="font-weight:700;font-size:17px;">${esc(x.appName)}</div>
      </div>
      <div style="font-size:18px;font-weight:700;margin-top:14px;">${esc(x.connTitle)}</div>
      <div class="sub">${esc(x.connSub)}</div>
      <label class="fld">${esc(x.apiUrl)}</label>
      <input id="f_api" class="inp" value="${esc(state.api)}" placeholder="http://localhost:8088">
      <label class="fld">${esc(x.adminToken)}</label>
      <input id="f_token" class="inp" type="password" value="${esc(state.token)}" placeholder="ADMIN_TOKEN">
      ${state.error?`<div style="margin-top:12px;color:var(--err-fg);font-size:13px;">${esc(x.connError)}<br><span style="color:var(--muted);font-size:11.5px;" class="mono">${esc(state.error).slice(0,160)}</span></div>`:''}
      <button class="btnP" data-action="connect" style="margin-top:18px;width:100%;justify-content:center;">${esc(x.connect)}</button>
    </div>
  </div>`;
}

function navItem(id, icon, label, badge){
  return `<button class="navbtn ${state.tab===id?'on':''}" data-action="tab" data-tab="${id}">
    ${icon}<span style="flex:1;">${esc(label)}</span>${badge||''}</button>`;
}
function sidebar(){
  const x=t(); const ic=ICONS;
  const licCount = state.data.licenses.length;
  const proCount = state.data.licenses.filter(l=>['pro','lifetime'].includes(l.plan)).length;
  return `<aside style="width:244px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--sidebar);padding:18px 14px;height:100vh;position:sticky;top:0;">
    <div style="display:flex;align-items:center;gap:11px;padding:6px 8px 22px;">
      <div style="width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;"><span style="color:#fff;font-weight:800;font-size:18px;letter-spacing:-1px;">V</span></div>
      <div style="line-height:1.1;"><div style="font-weight:700;font-size:15px;letter-spacing:-0.3px;">${esc(x.appName)}</div><div style="font-size:11px;color:var(--muted);font-weight:500;">${esc(x.console)}</div></div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:3px;">
      ${navItem('dashboard',ic.grid,x.nav.dashboard)}
      ${navItem('downloads',ic.dl,x.nav.downloads)}
      ${navItem('clients',ic.users,x.nav.clients)}
      ${navItem('finance',ic.chart,x.nav.finance,'<span class="demo">DEMO</span>')}
      ${navItem('subs',ic.refresh,x.nav.subs)}
      ${navItem('messages',ic.mail,x.nav.messages,'<span class="demo">DEMO</span>')}
      ${navItem('settings',ic.cog,x.nav.settings)}
    </nav>
    <div style="margin-top:auto;">
      <div style="background:var(--feature-bg);border-radius:13px;padding:15px;color:var(--feature-text);margin-bottom:14px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:3px;">${esc(x.kpiLicenses)}</div>
        <div style="font-size:11.5px;color:var(--feature-sub);">${proCount} Pro · ${licCount} ${state.lang==='pl'?'łącznie':'total'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:11px;padding:8px;">
        <div style="width:34px;height:34px;border-radius:50%;background:var(--avatar);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:13px;color:var(--avatar-text);">AD</div>
        <div style="line-height:1.2;"><div style="font-size:13.5px;font-weight:600;">${esc(x.roleAdmin)}</div><div style="font-size:11.5px;color:var(--muted);cursor:pointer;" data-action="logout">${esc(x.logout)}</div></div>
      </div>
    </div>
  </aside>`;
}

function topbar(){
  const x=t(); const ic=ICONS;
  return `<header style="display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--border);background:var(--topbar);backdrop-filter:blur(8px);flex:none;">
    <div style="display:flex;align-items:center;gap:8px;margin-right:auto;">
      <span style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;">${esc(x.connection)}</span>
      <span class="mono" style="font-size:11px;color:var(--text-med);background:var(--card);border:1px solid var(--border2);padding:4px 9px;border-radius:7px;">${esc(apiBase())}</span>
    </div>
    <button class="btnG" data-action="refresh">${ic.refresh}<span>${esc(x.refresh)}</span></button>
    <div style="display:flex;gap:2px;background:var(--card);border:1px solid var(--border2);border-radius:9px;padding:2px;">
      <button data-action="lang" data-lang="pl" style="padding:5px 11px;border-radius:7px;border:none;cursor:pointer;font-size:12.5px;font-weight:${state.lang==='pl'?700:600};background:${state.lang==='pl'?'var(--accent-tint)':'transparent'};color:${state.lang==='pl'?'var(--accent)':'var(--text2)'};">PL</button>
      <button data-action="lang" data-lang="en" style="padding:5px 11px;border-radius:7px;border:none;cursor:pointer;font-size:12.5px;font-weight:${state.lang==='en'?700:600};background:${state.lang==='en'?'var(--accent-tint)':'transparent'};color:${state.lang==='en'?'var(--accent)':'var(--text2)'};">EN</button>
    </div>
    <button data-action="theme" title="theme" style="width:38px;height:38px;border-radius:10px;border:1px solid var(--border2);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-med);">${state.theme==='dark'?ic.sun:ic.moon}</button>
  </header>`;
}

function main(){
  const body = {
    dashboard: viewDashboard, downloads: viewDownloads, clients: viewClients,
    finance: viewFinance, subs: viewSubs, messages: viewMessages, settings: viewSettings,
  }[state.tab] || viewDashboard;
  return `<main style="flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;">

// ============================ ZDARZENIA ============================
function bind(){
  document.querySelectorAll('[data-action]').forEach(el=>{ el.onclick = (e)=> handle(el.dataset.action, el, e); });
}
async function handle(action, el, e){
  const x=t();
  try{
    if(action==='connect'){ state.api=document.getElementById('f_api').value.trim(); state.token=document.getElementById('f_token').value.trim(); LS.api=state.api; LS.token=state.token; await loadAll(); return; }
    if(action==='saveConn'){ state.api=document.getElementById('s_api').value.trim(); state.token=document.getElementById('s_token').value.trim(); LS.api=state.api; LS.token=state.token; await loadAll(); toast('OK'); return; }
    if(action==='logout'){ state.connected=false; render(); return; }
    if(action==='tab'){ state.tab=el.dataset.tab; render(); return; }
    if(action==='theme'){ state.theme=state.theme==='dark'?'light':'dark'; LS.theme=state.theme; render(); return; }
    if(action==='lang'){ state.lang=el.dataset.lang; LS.lang=state.lang; render(); return; }
    if(action==='refresh'){ await loadAll(); toast(x.refresh); return; }
    if(action==='cfilter'){ clientFilter=el.dataset.f; render(); return; }
    if(action==='newLicense'){ modalNewLicense(); bind(); return; }
    if(action==='newVersion'){ modalNewVersion(); bind(); return; }
    if(action==='modalbg'){ if(e.target===el||el.classList.contains('btnG')) closeModal(); return; }
    if(action==='createLicense'){
      const body={ email:document.getElementById('m_email').value.trim(), plan:document.getElementById('m_plan').value, duration_days:+document.getElementById('m_days').value, max_devices:+document.getElementById('m_dev').value };
      if(!body.email){ toast('e-mail?'); return; }
      await api('/api/admin/licenses',{method:'POST',body:JSON.stringify(body)}); closeModal(); await loadAll(); toast('OK'); return;
    }
    if(action==='createVersion'){
      const body={ version:document.getElementById('v_version').value.trim(), platform:document.getElementById('v_platform').value, url:document.getElementById('v_url').value.trim()||null, sha256:document.getElementById('v_sha').value.trim()||null, size:+document.getElementById('v_size').value||null };
      if(!body.version){ toast('wersja?'); return; }
      await api('/api/admin/versions',{method:'POST',body:JSON.stringify(body)}); closeModal(); await loadAll(); toast('OK'); return;
    }
    if(action==='revoke'){ if(!confirm(x.confirmRevoke)) return; await api('/api/admin/licenses/'+el.dataset.id+'/revoke',{method:'POST'}); await loadAll(); toast('OK'); return; }
  }catch(err){ toast(String(err.message||err).slice(0,80)); }
}
