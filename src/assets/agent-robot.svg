<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Domyslna ikona agenta: czytelny robot. Wlasna grafika (NIE emoji) -> ten
       sam wyglad na Linux/macOS/Windows; emoji robota (U+1F916) renderowalo sie
       na Windows inaczej ("diabelek"). Jasne cialo + akcent cyjan = czytelny na
       ciemnym pasku zakladek. -->
  <!-- antena -->
  <line x1="32" y1="6" x2="32" y2="16" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="3.2" fill="#38bdf8"/>
  <!-- uszy -->
  <rect x="8" y="29" width="5" height="10" rx="2.5" fill="#94a3b8"/>
  <rect x="51" y="29" width="5" height="10" rx="2.5" fill="#94a3b8"/>
  <!-- glowa -->
  <rect x="14" y="16" width="36" height="34" rx="8" fill="#dbe2ea" stroke="#1f2430" stroke-width="2.5"/>
  <!-- oczy -->
  <circle cx="24" cy="30" r="4.2" fill="#0ea5e9"/>
  <circle cx="40" cy="30" r="4.2" fill="#0ea5e9"/>
  <circle cx="25.4" cy="28.6" r="1.3" fill="#e0f2fe"/>
  <circle cx="41.4" cy="28.6" r="1.3" fill="#e0f2fe"/>
  <!-- uśmiech (zamiast surowej kratki) -->
  <path d="M 23 39.5 Q 32 47.5 41 39.5" fill="none" stroke="#1f2430" stroke-width="2.8" stroke-linecap="round"/>
  <!-- rumieńce -->
  <circle cx="20" cy="37" r="2" fill="#fca5a5" opacity="0.75"/>
  <circle cx="44" cy="37" r="2" fill="#fca5a5" opacity="0.75"/>
</svg>
