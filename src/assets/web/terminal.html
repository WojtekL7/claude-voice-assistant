<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    /* Czcionki dołączone do aplikacji — terminal na macOS/Windows ma wyglądać
       TAK SAMO jak na Linuksie (a nie cienkim zamiennikiem systemu). */
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('../fonts/JetBrainsMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('../fonts/JetBrainsMono-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Ubuntu Mono';
      src: url('../fonts/UbuntuMono.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: #0a080e; overflow: hidden; }
    #terminal { width: 100%; height: 100%; }

    /* Suwak boczny terminala — odwzorowanie 1:1 wyglądu z Linuksa (QTermWidget,
       _QTERMWIDGET_SCROLLBAR_QSS w terminal_backend.py), żeby na macOS/Windows
       wyglądał TAK SAMO, a nie domyślnym cienkim overlay-em przeglądarki.
       Zdefiniowanie ::-webkit-scrollbar wyłącza macowy overlay → suwak zawsze
       widoczny i spójny na wszystkich platformach. */
    /* Suwak pojawia się TYLKO, gdy jest co przewijać (`overflow-y: auto`) — wtedy
       widać ruchomy uchwyt pokazujący pozycję. Gdy nie ma czego przewijać (np.
       Claude na pełnym ekranie zarządza ekranem sam), rynna jest SCHOWANA
       (życzenie usera). Tor przezroczysty, uchwyt = szary gradient. */
    .xterm-viewport {
      overflow-y: auto !important;
    }
    .xterm-viewport::-webkit-scrollbar {
      width: 12px;
      background: transparent;
    }
    .xterm-viewport::-webkit-scrollbar-track {
      background: transparent;
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
      /* Fioletowy uchwyt w kolorze akcentu (gui/theme.py), rogi 5px.
         Margines 2px (jak w Qt) odtworzony przezroczystą ramką + background-clip. */
      background: rgba(168, 85, 247, 0.28);
      border-radius: 5px;
      min-height: 30px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: rgba(168, 85, 247, 0.5);
      background-clip: padding-box;
    }
    /* Brak strzałek góra/dół (jak add-line/sub-line: height 0 w Qt). */
    .xterm-viewport::-webkit-scrollbar-button {
      display: none;
      height: 0;
      width: 0;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    // Polyfill: PyQtWebEngine-Qt5 5.15.2 na Windows niesie Chromium 83, a
    // xterm.js 5.x używa Element.replaceChildren (Chromium 86+). Bez tego
    // xterm.js padał ("replaceChildren is not a function") → terminal zostawał
    // pustym polem bez kursora (bug 1.0.12). Na nowszych Chromium = no-op.
    (function () {
      function polyfill(proto) {
        if (proto && !proto.replaceChildren) {
          proto.replaceChildren = function () {
            while (this.lastChild) this.removeChild(this.lastChild);
            if (arguments.length) this.append.apply(this, arguments);
          };
        }
      }
      polyfill(window.Element && Element.prototype);
      polyfill(window.Document && Document.prototype);
      polyfill(window.DocumentFragment && DocumentFragment.prototype);
    })();
  </script>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    // ===== Łańcuch czcionek terminala — JEDNO źródło =====
    // Kolejność NIE jest dowolna. Najpierw NASZE pliki (@font-face wyżej), potem
    // realne monospace systemu, a Menlo/Consolas dopiero NA KOŃCU. Powód: na
    // Linuksie fontconfig nigdy nie odmawia — nieznaną rodzinę (Menlo to krój
    // macOS) podmienia na "najlepsze dopasowanie", u nas PROPORCJONALNE Noto Sans
    // (sprawdzone `fc-match Menlo`). Gdyby Menlo stało przed realnym monospace,
    // pomiar szerokości znaku mógłby wypaść na czcionce o ZMIENNEJ szerokości.
    // Na macOS/Windows DejaVu zwykle nie ma → łańcuch schodzi do Menlo/Consolas.
    var FONT_STACK = '"JetBrains Mono", "Ubuntu Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace';

    const term = new Terminal({
      fontFamily: FONT_STACK,
      // 17 px = 13 pt przeliczone (96/72) — wartość startowa zgodna z tym, co
      // Python dośle przez __termFont (patrz web_terminal._push_font). Dzięki
      // temu litery nie "mrugają" mniejszym rozmiarem przez pierwszą klatkę.
      fontSize: 17,
      cursorBlink: true,
      scrollback: 10000,
      allowProposedApi: true,
      theme: { background: '#0a080e', foreground: '#b8b2c4' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));

    // ==================== SIATKA TERMINALA (kratka na znak) ====================
    // USTERKA 2026-08-04 „rozstrzelone litery" — zmierzona na zrzucie użytkownika:
    // xterm.js mierzy szerokość znaku RAZ, przy najbliższym rysowaniu po zmianie
    // czcionki. Gdy pomiar trafi w moment, w którym nasze .ttf jeszcze się nie
    // doczytały, przeglądarka rysuje SWOIM domyślnym krojem — na Linuksie
    // SZERYFOWYM ('W' w Noto Serif = 17,80 px przy fontSize 17, wobec 9,52 px
    // kratki Ubuntu Mono). Kratka zostaje wtedy ~1,88× za szeroka: litery mają
    // dziury, a druga połowa każdej linii wyjeżdża poza prawą krawędź i ZNIKA
    // (dowód z logu: PTY dostał 122 kolumny, na ekranie mieściło się ~65).
    // Trzy zabezpieczenia: (1) czujnik do logu, (2) fit() NIGDY w tym samym
    // takcie co zmiana czcionki, (3) strażnik przytomności z przemierzeniem.

    // Szerokość kratki, którą xterm.js REALNIE zmierzył — dokładnie tego pola
    // używa addon-fit do liczenia kolumn (pole prywatne biblioteki → try/catch).
    function cellWidth() {
      try { return term._core._renderService.dimensions.css.cell.width || 0; }
      catch (e) { return 0; }
    }

    // CZUJNIK — console.log trafia do ~/.vibe-coding-assistant/webterminal.log
    // (przechwytuje _LoggingWebEnginePage.javaScriptConsoleMessage w Pythonie).
    function logGrid(tag) {
      try {
        var fs = term.options.fontSize || 0;
        var cw = cellWidth();
        console.log('siatka[' + tag + '] cols=' + term.cols + ' rows=' + term.rows +
          ' kratka=' + cw.toFixed(2) + 'px fontSize=' + fs +
          ' kratka/fontSize=' + (fs ? (cw / fs).toFixed(3) : '?') +
          ' dpr=' + window.devicePixelRatio +
          ' fontGotowy=' + (document.fonts ? document.fonts.check(fs + 'px "Ubuntu Mono"') : '?') +
          ' rodzina=' + term.options.fontFamily);
      } catch (e) {}
    }

    // Dwie klatki rysowania — po nich xterm.js ma już PRZEMIERZONĄ kratkę.
    function afterTwoFrames(fn) {
      if (window.requestAnimationFrame) {
        requestAnimationFrame(function () { requestAnimationFrame(fn); });
      } else { setTimeout(fn, 32); }
    }

    // Wymuś ponowny pomiar. xterm przemierza tylko przy ZMIANIE opcji, więc
    // przypisanie tej samej wartości nic nie da — mrugamy rozmiarem o 1 px.
    function remeasure() {
      try {
        var fs = term.options.fontSize;
        term.options.fontSize = fs + 1;
        term.options.fontSize = fs;
      } catch (e) {}
    }

    // fit() + czujnik + STRAŻNIK PRZYTOMNOŚCI. Każdy monospace ma kratkę
    // 0,50–0,62 rozmiaru czcionki (Ubuntu Mono 0,56; DejaVu/JetBrains 0,60);
    // zamiennik proporcjonalny dawał 1,04. Poza przedziałem 0,45–0,75 →
    // przemierz i dopasuj ponownie, JEDNO podejście (żeby nie wpaść w pętlę).
    // Strażnik zamyka usterkę nawet wtedy, gdy przyczyna okaże się inna niż
    // wyścig z ładowaniem czcionki.
    var repairing = false;
    function safeFit(tag) { fitAndGuard(tag, 0); }

    function fitAndGuard(tag, attempt) {
      try { fitAddon.fit(); } catch (e) { repairing = false; return; }
      logGrid(tag);
      var fs = term.options.fontSize || 0;
      var cw = cellWidth();
      var ratio = (fs && cw) ? cw / fs : 0;
      if (!ratio || (ratio >= 0.45 && ratio <= 0.75)) { repairing = false; return; }
      if (attempt === 0 && repairing) return;      // naprawa już trwa
      if (attempt >= 2) {                          // dwie próby wystarczą
        console.log('siatka[' + tag + ']: kratka NADAL poza normą (' +
                    ratio.toFixed(3) + ') — zostawiam, żeby nie zapętlić');
        repairing = false;
        return;
      }
      repairing = true;
      console.log('siatka[' + tag + ']: kratka POZA NORMĄ (' + ratio.toFixed(3) +
                  ') — próba naprawy ' + (attempt + 1));
      // DRUGA próba — PLAN B. Samo przemierzenie nie pomoże, gdy rodzina jest
      // BEZ POKRYCIA (nazwa kroju, którego w systemie nie ma i który nie doczytał
      // się z naszych .ttf): przeglądarka rysuje wtedy domyślnym SZERYFOWYM i
      // każdy kolejny pomiar zwraca tę samą złą wartość (zmierzone sondą:
      // 17,82 px w kółko). Wracamy więc na pełny łańcuch, który kończy się
      // generycznym `monospace` — ten ZAWSZE ma stałą szerokość.
      if (attempt === 1) {
        try { term.options.fontFamily = FONT_STACK; } catch (e) {}
      }
      remeasure();
      afterTwoFrames(function () {
        fitAndGuard(tag + '/naprawa' + (attempt + 1), attempt + 1);
        try { term.refresh(0, term.rows - 1); } catch (e) {}
      });
    }

    // Zmiana czcionki → dopasowanie DOPIERO po przemierzeniu, nie w tym takcie.
    // `remeasure()` jest OBOWIĄZKOWE, nie ozdobne: samo odczekanie dwóch klatek
    // nie wymusza pomiaru, gdy xterm.js uzna, że opcje się nie zmieniły. Zmierzone
    // sondą 2026-08-04: po doczytaniu naszych .ttf kratka ZOSTAWAŁA ta z czcionki
    // zapasowej (10,25 px DejaVu zamiast 9,53 px Ubuntu Mono) — litery rozstrzelone
    // o 7%, czyli ta sama usterka, tylko cichsza.
    function fitAfterFontChange(tag) {
      remeasure();
      afterTwoFrames(function () {
        safeFit(tag);
        try { term.refresh(0, term.rows - 1); } catch (e) {}
      });
    }

    safeFit('start');

    // Nasze .ttf doczytują się asynchronicznie — po ich załadowaniu kratkę MUSIMY
    // zmierzyć jeszcze raz, inaczej zostaje ta z zamiennika. (`fonts.ready` czeka
    // na WSZYSTKIE kroje strony, `fonts.load` tylko na jeden — stąd zmiana.)
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        fitAfterFontChange('fonty-gotowe');
      }).catch(function () {});
    }

    // ===== Tryb myszy w terminalu (przełączany przyciskiem w UI) — WebTerminal =====
    // Dwa tryby, bo NIE DA SIĘ mieć obu naraz (mysz albo „należy" do Claude, albo do okna):
    //  • 'claude'  (DOMYŚLNY): mysz idzie do Claude — kółko przewija ROZMOWĘ Claude,
    //               klik w menu wyboru działa, a tekst zaznaczasz z SHIFT-em.
    //               To naturalne zachowanie xterm: NIE ruszamy sekwencji włączających mysz.
    //  • 'select': mysz odebrana Claude — przeciągnięciem zaznaczasz/kopiujesz BEZ Shift,
    //               ale kółko/klik nie idą do Claude. Realizacja:
    //               (B1) wycinamy z wyjścia sekwencje WŁĄCZAJĄCE mysz → xterm nie wchodzi
    //                    w tryb myszy → drag zaznacza natywnie (sekwencje …l przepuszczamy);
    //               (B2) na czas przeciągania ZAMRAŻAMY rysowanie wyjścia (odświeżenie
    //                    Claude nie zmaże zaznaczenia), po puszczeniu łapiemy tekst i dorysowujemy.
    // Przełączanie: window.__termSetMouseMode('claude'|'select'). Przy wejściu w 'select'
    // wyłączamy AKTYWNY tryb myszy (…l), przy powrocie do 'claude' przywracamy zapamiętane
    // włączenia, żeby Claude znów dostał mysz bez restartu.
    var _mouseMode = 'claude';                 // DOMYŚLNY — mysz do Claude (kółko przewija)
    var _lastMouseEnable = '';                 // ostatnie włączenia myszy od Claude (do przywrócenia)
    var _MOUSE_ON_RE = /\x1b\[\?(?:1000|1001|1002|1003|1005|1006|1015|1016)h/g;
    var _MOUSE_OFF_SEQ = '\x1b[?1000l\x1b[?1002l\x1b[?1003l\x1b[?1005l\x1b[?1006l\x1b[?1015l\x1b[?1016l';
    var _carry = "";   // urwana sekwencja prywatna na styku porcji danych
    function _scanAndStrip(data) {
      data = _carry + data; _carry = "";
      var m = data.match(/\x1b\[\?[0-9;]*$/);            // niedokończona ?... na końcu → przytrzymaj
      if (m) { _carry = m[0]; data = data.slice(0, data.length - m[0].length); }
      var ons = data.match(_MOUSE_ON_RE);               // zapamiętaj włączenia (do przywrócenia)
      if (ons) _lastMouseEnable = ons.join('');
      if (_mouseMode === 'select') data = data.replace(_MOUSE_ON_RE, "");   // B1 tylko w 'select'
      return data;
    }
    var _writePaused = false, _writeQueue = [], _unfreezeTimer = null;   // B2
    function _flushWrites() {
      _writePaused = false;
      if (_writeQueue.length) { var j = _writeQueue.join(""); _writeQueue = []; term.write(j); }
    }
    function safeWrite(data) {
      data = _scanAndStrip(data);
      if (!data) return;
      if (_writePaused) _writeQueue.push(data); else term.write(data);
    }
    // Wołane z Pythona przy kliknięciu przełącznika trybu myszy.
    window.__termSetMouseMode = function (mode) {
      if (mode !== 'select') mode = 'claude';
      if (mode === _mouseMode) return;
      _mouseMode = mode;
      if (mode === 'select') {
        term.write(_MOUSE_OFF_SEQ);                     // wyłącz aktywny tryb myszy → drag zaznacza
      } else {
        _writePaused = false; _writeQueue = [];         // bez resztek z trybu select
        term.write(_lastMouseEnable || '\x1b[?1000h\x1b[?1006h');   // przywróć mysz Claude
      }
    };
    window.__termMouseMode = function () { return _mouseMode; };

    // Funkcje wołane z Pythona.
    window.__termWrite  = function (data) { safeWrite(data); };
    window.__termClear  = function () { term.clear(); };
    window.__termFocus  = function () { term.focus(); };

    // 🔍 Szukanie: przewiń widok do NAJNOWSZEGO wiersza zawierającego frazę.
    // Świadomie bez dodatkowej biblioteki (addon-search) — pełne wyszukiwanie
    // robimy po dzienniku sesji w Pythonie, tu potrzebujemy tylko przewinięcia,
    // a to daje sam bufor xterma. Zwraca true/false do wołającego (runJavaScript).
    window.__termScrollTo = function (needle) {
      try {
        if (!needle) return false;
        var target = String(needle).toLowerCase();
        var buf = term.buffer.active;
        for (var i = buf.length - 1; i >= 0; i--) {
          var line = buf.getLine(i);
          if (!line) continue;
          if (line.translateToString(true).toLowerCase().indexOf(target) !== -1) {
            term.scrollToLine(Math.max(0, i - Math.floor(term.rows / 2)));
            return true;
          }
        }
        return false;
      } catch (e) { return false; }
    };
    // 🔊 Oddaj Pythonowi TEKST Z EKRANU (wyrenderowaną siatkę xterma).
    // Po co osobna funkcja, skoro Python ma własny bufor wyjścia: tamten to
    // STRUMIEŃ porcji z PTY — z kodami ANSI, z duchami po przerysowaniach TUI
    // (spinner pisze ~1×/s) i PRZYCIĘTY DO 5000 ZNAKÓW. Tutaj czytamy to, co
    // użytkownik NAPRAWDĘ widzi: xterm ma już złożoną siatkę, więc tekst jest
    // bez ANSI, bez mojibake (dekodowanie UTF-8 zrobił terminal) i bez powtórek.
    // To JEDYNE wiarygodne źródło, gdy Claude Code zamraża dziennik sesji na
    // czas pytania z polami wyboru (zmierzone 2026-09-04: dziennik stał 762 s,
    // a kotwica z dziennika była o 73 min starsza niż zawartość bufora 5000 zn.,
    // więc 🔊 milczał). `translateToString(true)` obcina puste ogony wierszy.
    window.__termScreenText = function (maxLines) {
      try {
        var buf = term.buffer.active;
        var ile = Math.max(1, Math.min(Number(maxLines) || 400, buf.length));
        var od  = Math.max(0, buf.length - ile);
        var out = [];
        for (var i = od; i < buf.length; i++) {
          var line = buf.getLine(i);
          out.push(line ? line.translateToString(true) : '');
        }
        return out.join('\n');
      } catch (e) { return null; }
    };

    // Pełny motyw xterm: tło, tekst, kursor, zaznaczenie + 16 kolorów ANSI.
    // Przyjmuje obiekt ITheme (z Pythona idzie jako literał JSON). Brak pola =
    // xterm użyje swojego domyślnego.
    window.__termTheme  = function (theme) {
      if (theme && typeof theme === 'object') term.options.theme = theme;
    };
    // Python dosyła TU rodzinę i rozmiar czcionki. fit() NIE MOŻE iść w tym samym
    // takcie: xterm.js przemierza kratkę dopiero przy najbliższym rysowaniu, więc
    // dopasowanie policzone teraz użyłoby metryki POPRZEDNIEJ czcionki. To była
    // przyczyna „rozstrzelonych liter" (patrz blok SIATKA TERMINALA wyżej).
    window.__termFont   = function (family, size) {
      if (family) term.options.fontFamily = family;
      if (size)   term.options.fontSize = size;
      fitAfterFontChange('python-font');
    };

    // Wymuszone przemierzenie siatki na żądanie Pythona — powrót do zakładki
    // i przeniesienie okna na inny ekran (patrz WebTerminal._refit_grid).
    window.__termRefit  = function () {
      fitAfterFontChange('refit');   // remeasure() jest już w środku
    };

    new QWebChannel(qt.webChannelTransport, function (channel) {
      const bridge = channel.objects.bridge;
      window.__bridge = bridge;  // udostępnij obsłudze upuszczania plików (drop) — patrz niżej
      // Python → terminal (wyjście PTY). Przez safeWrite: B1 (wytnij tryb myszy)
      // + B2 (zamrożenie na czas przeciągania) — patrz blok wyżej.
      bridge.output.connect(function (data) { safeWrite(data); });
      if (bridge.closed) bridge.closed.connect(function () {
        term.write('\r\n\x1b[90m[proces zakończony]\x1b[0m\r\n');
      });
      // terminal → Python.
      term.onData(function (d) { bridge.send_input(d); });
      term.onResize(function (sz) { bridge.resize(sz.cols, sz.rows); });
      // Tylko NIEPUSTE zaznaczenia trafiaja do Pythona. Claude (TUI) co chwile
      // odswieza ekran, a xterm.js KASUJE wtedy zaznaczenie (selectionChange z
      // pustym tekstem). Bez tego straznika kazde odswiezenie zerowaloby
      // _selection i kopiowanie zwracaloby pustke. Zapamietane zaznaczenie
      // zostaje do skopiowania (patrz tez blok "Utrzymanie zaznaczenia" nizej).
      term.onSelectionChange(function () {
        var s = term.getSelection();
        if (s) bridge.set_selection(s);
      });
      // Dopasuj rozmiar i zgłoś gotowość (Python odpali wtedy powłokę).
      safeFit('frontend-ready');
      bridge.frontend_ready(term.cols, term.rows);
      term.focus();
    });

    // Zmiana rozmiaru okna. To ONA leczyła usterkę „rozstrzelonych liter" sama
    // z siebie (log 2026-08-04, 09:10) — teraz idzie przez strażnika, więc
    // przy okazji naprawia kratkę, zamiast tylko przeliczać kolumny.
    window.addEventListener('resize', function () { safeFit('resize-okna'); });

    // ===== Utrzymanie zaznaczenia + zamrożenie na czas przeciągania (B2) =====
    // W trakcie przeciągania myszą: (1) WSTRZYMUJEMY rysowanie wyjścia (_writePaused),
    // żeby odświeżenie Claude nie zmazało zaznaczenia; (2) próbkujemy zaznaczenie.
    // Po puszczeniu myszy: łapiemy ostatnie NIEPUSTE zaznaczenie do Pythona
    // (_selection — stąd czyta kopiowanie/odczyt: WebTerminalBackend.copy_selection),
    // potem ODMRAŻAMY i dorysowujemy zaległe wyjście. Pustym nigdy nie nadpisujemy.
    // Bezpiecznik czasowy gwarantuje, że nigdy nie zostaniemy zamrożeni (gdyby
    // mouseup przepadł, np. puszczenie poza oknem).
    (function () {
      var el = document.getElementById('terminal');
      var poll = null;
      function grab() {
        try {
          var s = term.getSelection();
          if (s && window.__bridge) window.__bridge.set_selection(s);
        } catch (e) {}
      }
      function startDrag() {
        if (_mouseMode !== 'select') return;   // w trybie 'claude' nie zamrażamy — mysz idzie do Claude
        _writePaused = true;
        if (_unfreezeTimer) clearTimeout(_unfreezeTimer);
        _unfreezeTimer = setTimeout(endDrag, 6000);   // bezpiecznik: nie zostań zamrożony
        if (poll) clearInterval(poll);
        poll = setInterval(grab, 80);
      }
      function endDrag() {
        grab();
        if (poll) { clearInterval(poll); poll = null; }
        if (_unfreezeTimer) { clearTimeout(_unfreezeTimer); _unfreezeTimer = null; }
        // Daj zaznaczeniu „osiąść", złap raz jeszcze, potem odmroź i dorysuj zaległe.
        setTimeout(function () { grab(); _flushWrites(); }, 120);
      }
      el.addEventListener('mousedown', startDrag, true);
      window.addEventListener('mouseup', endDrag, true);
    })();
    // ===== koniec =====

    // ---- Upuszczanie plików (drag & drop) ----
    // WebTerminal działa na Chromium (QtWebEngine). BEZ tego Chromium reaguje na
    // upuszczony plik domyślnie: OTWIERA go na całe okno, przykrywając terminal —
    // i nie ma jak wyjść (brak paska adresu/przycisku wstecz). To zacinało wersję
    // pobraną (AppImage/macOS/Windows). Dlatego globalnie blokujemy domyślną akcję,
    // a zamiast tego wklejamy ŚCIEŻKĘ pliku do terminala — jak natywny terminal.
    function __dropPaths(e) {
      var dt = e.dataTransfer;
      if (!dt) return [];
      var out = [], uri = '';
      try { uri = dt.getData('text/uri-list'); } catch (_) {}
      if (uri) {
        uri.split(/[\r\n]+/).forEach(function (line) {
          line = line.trim();
          if (!line || line.charAt(0) === '#') return;        // komentarze w uri-list
          if (line.indexOf('file://') === 0) {
            var p = line.replace(/^file:\/\/[^\/]*/, '');      // usuń 'file://' + ewent. host
            try { p = decodeURIComponent(p); } catch (_) {}
            p = p.replace(/^\/([A-Za-z]:)/, '$1');             // Windows: /C:/.. -> C:/..
            out.push(p);
          }
        });
      }
      if (!out.length) {                                       // np. zaznaczony tekst z innego okna
        var txt = '';
        try { txt = dt.getData('text/plain'); } catch (_) {}
        if (txt && txt.trim()) out.push(txt.trim());
      }
      return out;
    }
    function __quote(p) { return /\s/.test(p) ? '"' + p + '"' : p; }
    ['dragenter', 'dragover'].forEach(function (ev) {
      window.addEventListener(ev, function (e) {
        e.preventDefault();                                    // pozwól na 'drop' i zablokuj nawigację
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      }, true);
    });
    window.addEventListener('drop', function (e) {
      e.preventDefault();                                      // <- to likwiduje "wpadnięcie w obrazek"
      e.stopPropagation();
      var paths = __dropPaths(e);
      if (paths.length && window.__bridge) {
        window.__bridge.send_input(paths.map(__quote).join(' '));
      }
      try { term.focus(); } catch (_) {}
    }, true);
  </script>
