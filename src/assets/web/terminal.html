<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    /* Ubuntu Mono dołączony do aplikacji — żeby terminal na macOS/Windows
       wyglądał TAK SAMO jak na Linuksie (a nie cienkim zamiennikiem systemu). */
    @font-face {
      font-family: 'Ubuntu Mono';
      src: url('../fonts/UbuntuMono.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: #1b1b1d; overflow: hidden; }
    #terminal { width: 100%; height: 100%; }

    /* Suwak boczny terminala — odwzorowanie 1:1 wyglądu z Linuksa (QTermWidget,
       _QTERMWIDGET_SCROLLBAR_QSS w terminal_backend.py), żeby na macOS/Windows
       wyglądał TAK SAMO, a nie domyślnym cienkim overlay-em przeglądarki.
       Zdefiniowanie ::-webkit-scrollbar wyłącza macowy overlay → suwak zawsze
       widoczny i spójny na wszystkich platformach. */
    .xterm-viewport::-webkit-scrollbar {
      width: 12px;
      background: transparent;
    }
    .xterm-viewport::-webkit-scrollbar-track {
      background: transparent;
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
      /* Gradient poziomy #888 → #aaa → #888, rogi 5px, min. wysokość 30px.
         Margines 2px (jak w Qt) odtworzony przezroczystą ramką + background-clip. */
      background: linear-gradient(to right, #888888 0%, #aaaaaa 50%, #888888 100%);
      border-radius: 5px;
      min-height: 30px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to right, #999999 0%, #bbbbbb 50%, #999999 100%);
      background-clip: padding-box;
    }
    /* Brak strzałek góra/dół (jak add-line/sub-line: height 0 w Qt). */
    .xterm-viewport::-webkit-scrollbar-button {
      display: none;
      height: 0;
      width: 0;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    // Polyfill: PyQtWebEngine-Qt5 5.15.2 na Windows niesie Chromium 83, a
    // xterm.js 5.x używa Element.replaceChildren (Chromium 86+). Bez tego
    // xterm.js padał ("replaceChildren is not a function") → terminal zostawał
    // pustym polem bez kursora (bug 1.0.12). Na nowszych Chromium = no-op.
    (function () {
      function polyfill(proto) {
        if (proto && !proto.replaceChildren) {
          proto.replaceChildren = function () {
            while (this.lastChild) this.removeChild(this.lastChild);
            if (arguments.length) this.append.apply(this, arguments);
          };
        }
      }
      polyfill(window.Element && Element.prototype);
      polyfill(window.Document && Document.prototype);
      polyfill(window.DocumentFragment && DocumentFragment.prototype);
    })();
  </script>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    const term = new Terminal({
      fontFamily: '"Ubuntu Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace',
      // 17 px = 13 pt przeliczone (96/72) — wartość startowa zgodna z tym, co
      // Python dośle przez __termFont (patrz web_terminal._push_font). Dzięki
      // temu litery nie "mrugają" mniejszym rozmiarem przez pierwszą klatkę.
      fontSize: 17,
      cursorBlink: true,
      scrollback: 10000,
      allowProposedApi: true,
      theme: { background: '#1b1b1d', foreground: '#e0e0e0' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Gdy Ubuntu Mono się załaduje, przerysuj terminal tą czcionką (inaczej
    // pierwsza klatka idzie zamiennikiem, zanim font dojedzie).
    if (document.fonts && document.fonts.load) {
      document.fonts.load('14px "Ubuntu Mono"').then(function () {
        try { term.options.fontFamily = '"Ubuntu Mono", Menlo, monospace'; } catch (e) {}
        fitAddon.fit();
        term.refresh(0, term.rows - 1);
      }).catch(function () {});
    }

    // ===== Zaznaczanie "jak w zwykłym terminalu" (bez Shift) — WebTerminal =====
    // Problem: gdy działa Claude (TUI), włącza RAPORTOWANIE MYSZY (DECSET ?1000..?1006 h)
    // → xterm.js wysyła ruchy myszy do programu zamiast zaznaczać (dawniej trzeba było
    // Shift), a częste odświeżenia ekranu Claude zmazują zaznaczenie.
    // Rozwiązanie dwuczęściowe:
    //  (B1) wycinamy z wyjścia sekwencje WŁĄCZAJĄCE mysz → xterm NIGDY nie wchodzi w
    //       tryb myszy → przeciągnięcie zaznacza natywnie, bez Shift (jak czysty bash).
    //       Sekwencje WYŁĄCZAJĄCE (…l) przepuszczamy. Reszta wyjścia nietknięta.
    //  (B2) na czas przeciągania ZAMRAŻAMY rysowanie wyjścia (kolejkujemy), żeby
    //       odświeżenie Claude nie zmazało zaznaczenia; po puszczeniu myszy łapiemy
    //       tekst i dorysowujemy zaległe wyjście.
    // Claude traci obsługę myszy w swoim oknie (przewijanie kółkiem działa natywnie) —
    // świadomy kompromis na rzecz pewnego zaznaczania/kopiowania.
    var _carry = "";   // urwana sekwencja prywatna na styku porcji danych (B1)
    function _stripMouse(data) {
      data = _carry + data; _carry = "";
      var m = data.match(/\x1b\[\?[0-9;]*$/);             // niedokończona ?... na końcu → przytrzymaj
      if (m) { _carry = m[0]; data = data.slice(0, data.length - m[0].length); }
      return data.replace(/\x1b\[\?(?:1000|1001|1002|1003|1005|1006|1015|1016)h/g, "");
    }
    var _writePaused = false, _writeQueue = [], _unfreezeTimer = null;   // B2
    function _flushWrites() {
      _writePaused = false;
      if (_writeQueue.length) { var j = _writeQueue.join(""); _writeQueue = []; term.write(j); }
    }
    function safeWrite(data) {
      data = _stripMouse(data);
      if (!data) return;
      if (_writePaused) _writeQueue.push(data); else term.write(data);
    }

    // Funkcje wołane z Pythona.
    window.__termWrite  = function (data) { safeWrite(data); };
    window.__termClear  = function () { term.clear(); };
    window.__termFocus  = function () { term.focus(); };
    // Pełny motyw xterm: tło, tekst, kursor, zaznaczenie + 16 kolorów ANSI.
    // Przyjmuje obiekt ITheme (z Pythona idzie jako literał JSON). Brak pola =
    // xterm użyje swojego domyślnego.
    window.__termTheme  = function (theme) {
      if (theme && typeof theme === 'object') term.options.theme = theme;
    };
    window.__termFont   = function (family, size) {
      if (family) term.options.fontFamily = family;
      if (size)   term.options.fontSize = size;
      fitAddon.fit();
    };

    new QWebChannel(qt.webChannelTransport, function (channel) {
      const bridge = channel.objects.bridge;
      window.__bridge = bridge;  // udostępnij obsłudze upuszczania plików (drop) — patrz niżej
      // Python → terminal (wyjście PTY). Przez safeWrite: B1 (wytnij tryb myszy)
      // + B2 (zamrożenie na czas przeciągania) — patrz blok wyżej.
      bridge.output.connect(function (data) { safeWrite(data); });
      if (bridge.closed) bridge.closed.connect(function () {
        term.write('\r\n\x1b[90m[proces zakończony]\x1b[0m\r\n');
      });
      // terminal → Python.
      term.onData(function (d) { bridge.send_input(d); });
      term.onResize(function (sz) { bridge.resize(sz.cols, sz.rows); });
      // Tylko NIEPUSTE zaznaczenia trafiaja do Pythona. Claude (TUI) co chwile
      // odswieza ekran, a xterm.js KASUJE wtedy zaznaczenie (selectionChange z
      // pustym tekstem). Bez tego straznika kazde odswiezenie zerowaloby
      // _selection i kopiowanie zwracaloby pustke. Zapamietane zaznaczenie
      // zostaje do skopiowania (patrz tez blok "Utrzymanie zaznaczenia" nizej).
      term.onSelectionChange(function () {
        var s = term.getSelection();
        if (s) bridge.set_selection(s);
      });
      // Dopasuj rozmiar i zgłoś gotowość (Python odpali wtedy powłokę).
      fitAddon.fit();
      bridge.frontend_ready(term.cols, term.rows);
      term.focus();
    });

    window.addEventListener('resize', function () { fitAddon.fit(); });

    // ===== Utrzymanie zaznaczenia + zamrożenie na czas przeciągania (B2) =====
    // W trakcie przeciągania myszą: (1) WSTRZYMUJEMY rysowanie wyjścia (_writePaused),
    // żeby odświeżenie Claude nie zmazało zaznaczenia; (2) próbkujemy zaznaczenie.
    // Po puszczeniu myszy: łapiemy ostatnie NIEPUSTE zaznaczenie do Pythona
    // (_selection — stąd czyta kopiowanie/odczyt: WebTerminalBackend.copy_selection),
    // potem ODMRAŻAMY i dorysowujemy zaległe wyjście. Pustym nigdy nie nadpisujemy.
    // Bezpiecznik czasowy gwarantuje, że nigdy nie zostaniemy zamrożeni (gdyby
    // mouseup przepadł, np. puszczenie poza oknem).
    (function () {
      var el = document.getElementById('terminal');
      var poll = null;
      function grab() {
        try {
          var s = term.getSelection();
          if (s && window.__bridge) window.__bridge.set_selection(s);
        } catch (e) {}
      }
      function startDrag() {
        _writePaused = true;
        if (_unfreezeTimer) clearTimeout(_unfreezeTimer);
        _unfreezeTimer = setTimeout(endDrag, 6000);   // bezpiecznik: nie zostań zamrożony
        if (poll) clearInterval(poll);
        poll = setInterval(grab, 80);
      }
      function endDrag() {
        grab();
        if (poll) { clearInterval(poll); poll = null; }
        if (_unfreezeTimer) { clearTimeout(_unfreezeTimer); _unfreezeTimer = null; }
        // Daj zaznaczeniu „osiąść", złap raz jeszcze, potem odmroź i dorysuj zaległe.
        setTimeout(function () { grab(); _flushWrites(); }, 120);
      }
      el.addEventListener('mousedown', startDrag, true);
      window.addEventListener('mouseup', endDrag, true);
    })();
    // ===== koniec =====

    // ---- Upuszczanie plików (drag & drop) ----
    // WebTerminal działa na Chromium (QtWebEngine). BEZ tego Chromium reaguje na
    // upuszczony plik domyślnie: OTWIERA go na całe okno, przykrywając terminal —
    // i nie ma jak wyjść (brak paska adresu/przycisku wstecz). To zacinało wersję
    // pobraną (AppImage/macOS/Windows). Dlatego globalnie blokujemy domyślną akcję,
    // a zamiast tego wklejamy ŚCIEŻKĘ pliku do terminala — jak natywny terminal.
    function __dropPaths(e) {
      var dt = e.dataTransfer;
      if (!dt) return [];
      var out = [], uri = '';
      try { uri = dt.getData('text/uri-list'); } catch (_) {}
      if (uri) {
        uri.split(/[\r\n]+/).forEach(function (line) {
          line = line.trim();
          if (!line || line.charAt(0) === '#') return;        // komentarze w uri-list
          if (line.indexOf('file://') === 0) {
            var p = line.replace(/^file:\/\/[^\/]*/, '');      // usuń 'file://' + ewent. host
            try { p = decodeURIComponent(p); } catch (_) {}
            p = p.replace(/^\/([A-Za-z]:)/, '$1');             // Windows: /C:/.. -> C:/..
            out.push(p);
          }
        });
      }
      if (!out.length) {                                       // np. zaznaczony tekst z innego okna
        var txt = '';
        try { txt = dt.getData('text/plain'); } catch (_) {}
        if (txt && txt.trim()) out.push(txt.trim());
      }
      return out;
    }
    function __quote(p) { return /\s/.test(p) ? '"' + p + '"' : p; }
    ['dragenter', 'dragover'].forEach(function (ev) {
      window.addEventListener(ev, function (e) {
        e.preventDefault();                                    // pozwól na 'drop' i zablokuj nawigację
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      }, true);
    });
    window.addEventListener('drop', function (e) {
      e.preventDefault();                                      // <- to likwiduje "wpadnięcie w obrazek"
      e.stopPropagation();
      var paths = __dropPaths(e);
      if (paths.length && window.__bridge) {
        window.__bridge.send_input(paths.map(__quote).join(' '));
      }
      try { term.focus(); } catch (_) {}
    }, true);
  </script>
</body>
</html>
